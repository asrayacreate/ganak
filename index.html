<style>
:root{
  --ink:#15202A; --ink2:#3B4854; --mute:#727E8A;
  --paper:#F1EFE4; --card:#FFFFFF; --line:#DFDACA; --line2:#ECE9DC; --grid:rgba(84,110,130,.10);
  --tape:#F5B301; --tape-dk:#B98700;
  --con:#B4442F; --np:#2E6B4F; --fin:#1D5B8C; --util:#5A6470;
  --wa:#128C7E;
  --fs:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Mangal","Kalimati",sans-serif;
  --fm:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--fs);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}

/* ---------- header ---------- */
header{background:var(--ink);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.brandrow{display:flex;align-items:center;gap:9px}
.brandrow .logo,.brandrow .logo-np{align-self:baseline}
.gring{position:relative;width:34px;height:34px;flex:0 0 auto;border-radius:50%;align-self:center;
  background:conic-gradient(#F5B301,#7FE0A7,#4AA3E0,#B48CE0,#E0705A,#F5B301);
  animation:gspin 9s linear infinite;box-shadow:0 0 10px rgba(245,179,1,.35)}
.gring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.gring i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:16px;font-weight:800;color:var(--tape);
  animation:gspin 9s linear infinite reverse}
@keyframes gspin{to{transform:rotate(360deg)}}
.logo{font-family:"Saira Stencil One",var(--fs);font-size:24px;font-weight:400;letter-spacing:.5px;color:#fff}
.logo b{color:var(--tape)}
.logo-np{font-size:15px;font-weight:700;color:var(--tape);letter-spacing:0}
.tagline{margin-top:2px;font-size:11.5px;color:#9EAAB6;letter-spacing:.3px}
.hdr-back{background:none;border:0;color:var(--tape);font-size:15px;font-weight:700;
  padding:0 0 6px;display:none;cursor:pointer;font-family:var(--fs)}
/* signature: measuring-tape ruler strip */
.ruler{height:11px;
  background-color:var(--tape);
  background-image:
    repeating-linear-gradient(90deg,rgba(21,32,42,.9) 0 1.5px,transparent 1.5px 40px),
    repeating-linear-gradient(90deg,rgba(21,32,42,.42) 0 1px,transparent 1px 8px);
  background-size:100% 100%,100% 52%;
  background-repeat:repeat-x,repeat-x;
  background-position:0 0,0 0;
  border-bottom:1px solid rgba(0,0,0,.15)}

/* ---------- home ---------- */
.pad{padding:14px 14px 0}
.search{width:100%;font-size:16px;font-family:var(--fs);padding:11px 13px;
  border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--fs);font-size:13px;font-weight:600;padding:6px 12px;
  border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--mute);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tcard{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--util);border-radius:10px;padding:11px 10px 10px;cursor:pointer;
  font-family:var(--fs);color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:78px;
  box-shadow:0 1px 2px rgba(21,32,42,.04), 0 2px 8px rgba(21,32,42,.05);
  transition:box-shadow .15s, transform .15s}
.tcard:active{background:#FAF9F3;transform:translateY(1px);box-shadow:0 1px 2px rgba(21,32,42,.05)}
.tcard .ic{line-height:0;height:22px}
.tcard .ic svg{width:22px;height:22px}
.tcard .nm{font-size:13.5px;font-weight:700;line-height:1.25;margin-top:4px}
.tcard .sb{font-size:10.5px;color:var(--mute);line-height:1.3}
.tcard .star{position:absolute;top:7px;right:8px;font-size:10px;color:var(--tape-dk)}
.tcard .neu{position:absolute;top:6px;right:6px;font-size:8.5px;font-weight:800;letter-spacing:.6px;
  background:var(--tape);color:var(--ink);padding:2px 5px;border-radius:4px}
.cat-con{border-left-color:var(--con)} .cat-np{border-left-color:var(--np)}
.cat-fin{border-left-color:var(--fin)} .cat-util{border-left-color:var(--util)}
.empty{padding:26px 4px;text-align:center;color:var(--mute);font-size:14px}

/* ---------- tool view ---------- */
#tool{display:none;padding:14px 14px 96px}
.t-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.t-ic{line-height:0;padding-top:3px}
.t-ic svg{width:30px;height:30px}
.t-nm{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.t-sb{font-size:12px;color:var(--mute);margin-top:1px}
.ex{background:#FFF8E4;border:1px solid #F0DFA8;border-radius:8px;padding:9px 11px;
  font-size:12.5px;color:#5D4B18;margin:11px 0 14px;display:flex;gap:10px;align-items:flex-start}
.ex b{font-weight:700}
.ex button{flex:0 0 auto;margin-left:auto;background:var(--ink);color:#fff;border:0;border-radius:6px;
  padding:5px 9px;font-size:11.5px;font-weight:700;font-family:var(--fs);cursor:pointer}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 2}
.f.half{grid-column:span 1}
.fl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.fl em{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mute);font-weight:400}
.f input,.f select{width:100%;font-size:16px;font-family:var(--fm);padding:10px 11px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.f select{font-family:var(--fs);font-size:14.5px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.f input:focus,.f select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(245,179,1,.28)}
.f input[type=date]{font-family:var(--fm)}
.f textarea{width:100%;font-size:15.5px;font-family:var(--fs);padding:10px 11px;resize:vertical;min-height:88px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);line-height:1.55}
.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(245,179,1,.28)}
.row.txt{display:block}
.row.txt .rv{display:block;text-align:left;font-size:17px;line-height:1.7;font-family:var(--fs);white-space:pre-wrap;word-break:break-word;background:none;padding:6px 0 0;margin:0}

/* ---------- result slip ---------- */
.slip{position:relative;background:var(--card);border:1px solid var(--line);border-bottom:0;
  border-radius:10px 10px 0 0;padding:14px 14px 16px;margin:18px 0 0;
  box-shadow:0 2px 10px rgba(21,32,42,.06)}
.slip::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-11px;height:11px;
  background:
    linear-gradient(45deg,transparent 50%,var(--card) 50%) 0 0/11px 11px repeat-x,
    linear-gradient(-45deg,transparent 50%,var(--card) 50%) 0 0/11px 11px repeat-x;
  filter:drop-shadow(0 1px 0 var(--line))}
.slip-h{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--mute);padding-bottom:9px;border-bottom:1.5px solid var(--ink);margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slipmeta{font-weight:600;letter-spacing:.3px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:baseline;gap:6px;padding:5.5px 0;font-size:14px}
.row .rl{line-height:1.3}
.row .rl{color:var(--ink2);flex:0 0 auto;max-width:58%;overflow-wrap:break-word}
.row .dots{flex:1 1 auto;border-bottom:1px dotted #CDC8B8;transform:translateY(-3px)}
.row .rv{font-family:var(--fm);font-weight:600;flex:0 0 auto;white-space:nowrap}
.row .ru{font-family:var(--fm);font-size:11.5px;color:var(--mute);flex:0 0 auto}
.row.big{padding:9px 0 3px;margin-top:4px;border-top:1.5px solid var(--ink)}
.row.big .rl{font-weight:700;font-size:14.5px}
.rw{font-size:11px;font-weight:600;color:var(--mute);text-align:right;margin-top:1px;background:none;padding:0}
.row.big .rv{font-size:23px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;
  background:linear-gradient(transparent 66%,rgba(245,179,1,.45) 66%);padding:0 3px;margin-right:-3px}
.row.sub .rl,.row.sub .rv,.row.sub .ru{color:var(--mute);font-size:12.5px}
.row.hero{border-top:0;border-bottom:1.5px solid var(--ink);margin:0 0 7px;padding:2px 0 11px}
.row.hero .rv{font-size:26px}
.sched{margin:24px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.sched summary{list-style:none;cursor:pointer;padding:12px 13px;display:flex;align-items:center;gap:9px;
  font-size:13.5px;font-weight:700;background:#F7F5EC;border-bottom:1px solid var(--line)}
.sched summary::-webkit-details-marker{display:none}
.sched summary::after{content:"\25BE";margin-left:auto;font-size:12px;color:var(--mute)}
.sched[open] summary::after{content:"\25B4"}
.sched summary .sc{font-weight:600;color:var(--mute);font-size:11.5px;font-family:var(--fm)}
.sched-act{padding:9px 13px 0}
.mini{font-family:var(--fs);font-size:12px;font-weight:700;padding:6px 11px;border-radius:7px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tw{max-height:54vh;overflow:auto;margin-top:9px;-webkit-overflow-scrolling:touch}
.tw table{width:100%;border-collapse:collapse;font-family:var(--fm);font-size:12px}
.tw th{position:sticky;top:0;background:var(--ink);color:#fff;font-family:var(--fs);font-size:11px;
  font-weight:700;text-align:right;padding:8px 9px;white-space:nowrap;z-index:1}
.tw th:first-child{text-align:left}
.tw td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
.tw td:first-child{text-align:left;color:var(--mute)}
.tw tr:nth-child(even) td{background:#FAF9F3}
.tw tr.gr td{background:#FFF8E4;color:#5D4B18;font-family:var(--fs);font-size:11.5px;font-weight:700;
  text-align:left;border-bottom:1px solid #F0DFA8}
.langsw{margin-left:auto;display:flex;border:1.5px solid #3E4C58;border-radius:20px;overflow:hidden}
.langsw button{font-family:var(--fs);font-size:13px;font-weight:800;padding:7px 15px;border:0;
  background:transparent;color:#9EAAB6;cursor:pointer;line-height:1.5;min-width:48px}
.langsw button.on{background:var(--tape);color:var(--ink)}
.calcbox{margin-top:4px}
.ctot{display:none;align-items:center;gap:8px;background:var(--card);border:1.5px dashed var(--tape-dk);border-radius:9px;
  padding:8px 11px;margin-bottom:8px;font-size:12.5px;color:var(--ink2)}
.ctot.on{display:flex}
.ctot b{font-family:var(--fm);font-size:15px;color:var(--ink)}
.ctot button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--fs)}
.k.mem2{background:#FFF3D1;border-color:var(--tape-dk);color:#6B5307;font-size:13px;font-weight:800}
body[data-theme="dark"] .k.mem2{background:#2A2310;border-color:#4A3C14;color:#E2D5A2}
.vbtn.mic{flex:0 0 auto;min-width:44px}
.vbtn.mic.rec{background:#B4442F;border-color:#B4442F;color:#fff;animation:micpulse 1s infinite}
@keyframes micpulse{50%{opacity:.75}}
@keyframes brandshift{
  0%,100%{background-color:#0B121A}
  30%{background-color:#0E2A20}
  55%{background-color:#0D2233}
  80%{background-color:#231A2E}
}
.kbtn.mem{background:#FFF3D1;border-color:var(--tape-dk);color:#6B5307;font-size:12.5px;font-weight:800}
body[data-theme="dark"] .kbtn.mem{background:#2A2310;border-color:#4A3C14;color:#E2D5A2}
body[data-theme="dark"] .ctot{background:#1B2530}
.disp{background:var(--ink);border-radius:11px;padding:13px 15px 15px;text-align:right;overflow:hidden}
.disp .dexp{font-family:var(--fm);font-size:12.5px;color:#8F9CA8;min-height:17px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.disp .dval{font-family:var(--fm);font-size:37px;font-weight:700;color:var(--tape);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.disp .dwords{font-family:var(--fs);font-size:12.5px;color:#AEB9C4;line-height:1.4;margin-top:7px;
  min-height:16px;text-align:right;white-space:normal;word-break:break-word}
.vatrow{display:flex;gap:7px;align-items:stretch;margin:11px 0 9px}
.vlab{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  color:var(--ink2);border:1.5px solid var(--line);border-radius:9px;padding:0 9px;background:var(--card)}
.vlab input{width:42px;font-family:var(--fm);font-size:15px;border:0;background:transparent;
  color:var(--ink);text-align:center;padding:6px 0}
.vlab input:focus{outline:none}
.vbtn{flex:1;font-family:var(--fs);font-size:12.5px;font-weight:700;border-radius:9px;padding:11px 4px;
  border:1.5px solid var(--tape-dk);background:#FFF3D1;color:#4A3A08;cursor:pointer;line-height:1.25}
.vbtn:active{background:var(--tape)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{font-family:var(--fm);font-size:20px;font-weight:700;padding:15px 0;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.k:active{transform:translateY(1px);background:#F2F0E5}
.k.fn{background:#EBE8DB;font-size:17px}
body[data-theme="dark"] .k.fn{background:#243140;color:#E8ECF0}
body[data-theme="dark"] .k:active{background:#141D27}
body[data-theme="dark"] .k.eq{background:var(--tape);border-color:var(--tape-dk);color:#15202A}
.k.op{background:var(--tape);border-color:var(--tape-dk);color:var(--ink)}
.k.eq{grid-column:span 2;background:var(--ink);border-color:var(--ink);color:#fff}
.fxnote{background:#EDF4FA;border:1px solid #C3DCEF;color:#17435F;border-radius:8px;
  padding:9px 11px;font-size:12px;margin:11px 0 2px;line-height:1.45}
.note{margin-top:11px;padding-top:9px;border-top:1px solid var(--line2);
  font-size:11.5px;color:var(--mute);line-height:1.5}
.err{background:#FDECEA;border:1px solid #F3C3BC;color:#8C2A19;border-radius:8px;
  padding:10px 12px;font-size:13px;margin-top:16px}

/* ---------- buttons / branding ---------- */
.btnrow{display:flex;gap:8px;margin-top:22px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--fs);font-size:14px;font-weight:700;padding:12px 10px;border-radius:9px;
  border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.call{background:var(--ink);color:#fff}
.brand{position:relative;overflow:hidden;margin:22px 0 0;background:#0B121A;color:#fff;border-radius:12px;
  animation:brandshift 24s ease-in-out infinite;
  padding:20px 14px 21px;text-align:center;
  background-image:radial-gradient(ellipse 120% 90% at 50% -20%,rgba(245,179,1,.13),transparent 55%),
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:100% 100%,24px 24px,24px 24px}
.brand::before,.brand::after{content:"";position:absolute;left:0;right:0;height:8px;background-color:var(--tape);
  background-image:repeating-linear-gradient(90deg,rgba(21,32,42,.9) 0 2px,transparent 2px 34px),
    repeating-linear-gradient(90deg,rgba(21,32,42,.45) 0 1.2px,transparent 1.2px 6.8px);
  background-size:100% 100%,100% 55%;background-repeat:repeat-x}
.brand::before{top:0}
.brand::after{bottom:0;transform:scaleY(-1)}
.brand .bhouse{display:block;margin:2px auto 9px;line-height:0}
.brand .bhouse svg{width:46px;height:46px;filter:drop-shadow(0 3px 8px rgba(245,179,1,.25))}
.brand .bt{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#8FCCA6}
.brand .bn{font-family:"Saira Stencil One",var(--fs);font-size:18px;font-weight:400;margin:4px 0 2px;color:#7FE0A7;letter-spacing:1.2px}
.brand .bd{font-size:11.5px;color:#A9D8BC;letter-spacing:.4px}
.brand .bd::before,.brand .bd::after{content:"—";margin:0 7px;color:#39434E}
.brand .btnrow{margin-top:12px}
.brand .btn{border-color:transparent}
.brand .btn.call{background:var(--tape);color:var(--ink)}
footer{padding:14px 14px 30px;text-align:center;font-size:11px;color:var(--mute)}

/* ---------- sticky result bar ---------- */
.sticky{position:fixed;bottom:0;left:0;right:0;z-index:30;display:none;
  background:var(--ink);color:#fff;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  box-shadow:0 -3px 14px rgba(21,32,42,.22)}
.sticky-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:9px}
.sticky .sl{font-size:10.5px;color:#9EAAB6;letter-spacing:.6px;text-transform:uppercase}
.sticky .sv{font-family:var(--fm);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticky .sbtn{flex:0 0 auto;border:0;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;
  font-family:var(--fs);cursor:pointer;background:#2C3A47;color:#fff}
.sticky .sbtn.wa{background:var(--wa)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:40;
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .22s}
.toast.on{opacity:1}
/* ---------- v2: shell + sidebar ---------- */
#side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:280px;max-width:84vw;
  background:var(--ink);z-index:62;transform:translateX(-105%);transition:transform .22s;overflow-y:auto}
body.sideopen #side{transform:none}
.hdr-menu{background:none;border:0;cursor:pointer;padding:2px 10px 2px 0;line-height:0}
@media(min-width:760px){.hdr-menu{display:none}}
@media(min-width:760px){
  .shell{display:flex;max-width:1240px;margin:0 auto;min-height:100vh;box-shadow:0 0 44px rgba(21,32,42,.10)}
  #side{position:sticky;top:0;bottom:auto;height:100vh;width:252px;max-width:none;flex:0 0 252px;
    transform:none;transition:none;z-index:auto}
  .wrap{flex:1;max-width:none;min-width:0}
  header{display:none}
  .pad{max-width:680px;margin:0 auto;padding-top:24px}
  #tool{max-width:680px;margin:0 auto;padding-top:24px}
}
@media(min-width:1080px){
  #side{width:280px;flex:0 0 280px}
  .grid{grid-template-columns:1fr 1fr 1fr}
}
.side-brand{padding:20px 18px 13px}
.side-brand .tagline{margin-top:3px}
.side-ruler{height:9px;flex:0 0 auto;background-color:var(--tape);
  background-image:repeating-linear-gradient(90deg,rgba(21,32,42,.9) 0 1.5px,transparent 1.5px 40px),
  repeating-linear-gradient(90deg,rgba(21,32,42,.42) 0 1px,transparent 1px 8px);
  background-size:100% 100%,100% 52%;background-repeat:repeat-x}
.side-nav{flex:1;padding:8px 10px 14px}
.sn-cat{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#7E8B97;margin:15px 8px 5px}
.sn-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;
  padding:8px 10px;color:#D7DEE4;font-family:var(--fs);font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.3}
.sn-item:hover{background:#22303D}
.sn-item.on{background:#2C3A47;color:#fff;box-shadow:inset 3px 0 0 var(--tape)}
.sn-item svg{width:18px;height:18px;flex:0 0 auto;stroke:#C3CDD6}
.sn-item .snb{margin-left:auto;background:var(--tape);color:var(--ink);font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 7px}
.side-foot{flex:0 0 auto;padding:10px;border-top:1px solid #2C3A47}
/* ---------- settings drawer ---------- */
.firstrun{position:fixed;inset:0;z-index:80;background:rgba(11,18,26,.78);display:flex;align-items:center;justify-content:center;padding:22px}
.firstrun[hidden]{display:none}
.fr-card{background:var(--card);border-radius:14px;padding:22px 20px;width:100%;max-width:330px;box-shadow:0 18px 60px rgba(0,0,0,.4)}
.fr-logo{font-family:"Saira Stencil One",var(--fs);font-size:26px;color:var(--ink)}
.fr-logo b{color:var(--tape-dk)}
.fr-logo span{font-family:var(--fs);font-size:15px;font-weight:700;color:var(--mute);margin-left:6px}
.fr-rule{height:6px;margin:10px 0 14px;background-color:var(--tape);border-radius:3px;
  background-image:repeating-linear-gradient(90deg,rgba(21,32,42,.85) 0 1.5px,transparent 1.5px 26px)}
.fr-t{font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:10px}
.fr-btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:11px 13px;margin-bottom:8px;cursor:pointer;font-family:var(--fs);color:var(--ink)}
.fr-btn:hover{border-color:var(--ink)}
.fr-btn b{font-size:15.5px;font-weight:800;display:block}
.fr-btn span{font-size:11.5px;color:var(--mute)}
.scrim{position:fixed;inset:0;background:rgba(21,32,42,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;transform:translateX(105%);width:340px;max-width:92vw;height:100%;background:var(--card);
  z-index:61;transition:transform .22s;box-shadow:-6px 0 24px rgba(21,32,42,.18);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;padding:14px 16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;flex:0 0 auto}
.dr-h button{margin-left:auto;background:none;border:0;color:#9EAAB6;font-size:18px;cursor:pointer;padding:2px 4px}
.dr-b{flex:1;overflow-y:auto;padding:14px 16px 26px}
.dr-sec{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);
  margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.dr-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.dr-b .dr-sec:first-child{margin-top:2px}
.langsw.lt{border-color:var(--line);display:inline-flex}
.langsw.lt button{color:var(--mute)}
.langsw.lt button.on{color:var(--ink)}
.bgopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bgo{border:1.5px solid var(--line);border-radius:9px;background:var(--card);padding:7px;cursor:pointer;text-align:left;font-family:var(--fs);color:var(--ink)}
.bgo.on{border-color:var(--ink);box-shadow:0 0 0 2.5px rgba(245,179,1,.4)}
.bgo .sw{height:32px;border-radius:5px;border:1px solid var(--line);margin-bottom:6px}
.bgo .bn2{font-size:12px;font-weight:700;line-height:1.2}
.bgo .bs2{font-size:10.5px;color:var(--mute)}
.pfin{width:100%;font-size:14px;font-family:var(--fs);padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;
  margin-bottom:8px;background:var(--card);color:var(--ink);box-sizing:border-box}
.pfin:focus{outline:none;border-color:var(--ink)}
.drnote{font-size:11px;color:var(--mute);line-height:1.45}
.remquick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.remquick button{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:5px 11px;
  font-family:var(--fs);font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.remquick button:hover{border-color:var(--tape-dk);color:var(--ink)}
.remit .re{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;padding:2px 4px}
.remit.editing{background:#FFF9E8;border-radius:8px;padding:9px 8px}
body[data-theme="dark"] .remit.editing{background:#241E10}
.notibar{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-130%);width:min(480px,calc(100vw - 24px));
  z-index:90;background:var(--ink);color:#fff;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 34px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);cursor:pointer;
  border-left:4px solid var(--tape)}
.notibar.show{transform:translateX(-50%) translateY(0)}
.notibar.due{border-left-color:#FF7A5C}
.notibar .nbic{font-size:20px;line-height:1;animation:nbring 1.6s ease-in-out infinite}
@keyframes nbring{0%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(11deg)}30%{transform:rotate(-7deg)}40%{transform:rotate(0)}}
.notibar .nbt{flex:1;min-width:0}
.notibar .nbk{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tape)}
.notibar.due .nbk{color:#FF9B84}
.notibar .nbm{font-size:12.5px;font-weight:700;line-height:1.3}
.notibar .nbx{background:none;border:0;color:#8F9CA8;font-size:15px;cursor:pointer;padding:2px 5px;flex:0 0 auto}
.remadd{display:grid;gap:7px;margin-bottom:10px}
.remadd .r2{display:flex;gap:7px}
.remadd input[type=date]{flex:1;font-family:var(--fm)}
.rembtn{flex:0 0 auto;background:var(--ink);color:#fff;border:0;border-radius:8px;font-family:var(--fs);font-size:13px;font-weight:700;padding:9px 14px;cursor:pointer}
.remit{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line2);font-size:13px}
.remit .rt{flex:1;min-width:0}
.remit .rd{font-family:var(--fm);font-size:11px;color:var(--mute)}
.remit .rd.due{color:#B4442F;font-weight:700}
.remit .rd.today{color:#8A6A00;font-weight:700}
.remit .rx{background:none;border:0;color:var(--mute);font-size:15px;cursor:pointer;padding:2px 4px}
.hdr-ic{position:relative;background:none;border:0;cursor:pointer;padding:4px 0 4px 10px;line-height:0;align-self:center}
.hdot{position:absolute;top:2px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--tape);display:none}
.hdot.on{display:block}
.pflogo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pflogo img{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1.5px solid var(--line);background:#fff}
.plph{width:44px;height:44px;border-radius:9px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:8.5px;color:var(--mute);text-align:center;line-height:1.2}
.plbtn{font-size:12px;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.plx{background:none;border:0;color:var(--mute);font-size:14px;cursor:pointer}
.bizcard{display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;margin:0 0 13px;box-shadow:0 1px 4px rgba(21,32,42,.06)}
.bizcard img{width:42px;height:42px;border-radius:9px;object-fit:cover;border:1px solid var(--line);background:#fff;flex:0 0 auto}
.bizcard .bini{width:42px;height:42px;border-radius:9px;background:var(--ink);color:var(--tape);display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;flex:0 0 auto}
.bizcard .bcd{min-width:0;flex:1}
.bizcard .bcn{font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bizcard .bcs{font-size:11.5px;color:var(--mute);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hslide{display:block;width:100%;text-align:left;border:0;margin-top:13px;padding:2px;cursor:pointer;font-family:var(--fs);
  position:relative;z-index:1;border-radius:12px;
  background:linear-gradient(100deg,#F5B301,#7FE0A7,#4AA3E0,#B48CE0,#E0705A,#F5B301);
  background-size:320% 100%;animation:hsrainbow 14s linear infinite}
@keyframes hsrainbow{to{background-position:320% 0}}
.hslide .hsin{display:block;background:#101A26;border-radius:10px;padding:9px 12px 10px}
.hslide .hsk{font-size:9.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#8F9CA8}
.hslide .hsrow{display:flex;align-items:center;gap:9px;margin-top:5px;transition:opacity .35s}
.hslide.fade .hsrow{opacity:0}
.hslide .hsic{flex:0 0 auto;line-height:0}
.hslide .hsic svg{width:24px;height:24px;stroke:#F5B301}
.hslide .hsn{font-size:14px;font-weight:800;color:#fff;line-height:1.25}
.hslide .hss{font-size:11.5px;color:#B9C4CE;line-height:1.4;margin-top:1px}
.hslide .hsarr{margin-left:auto;color:var(--tape);font-weight:800;flex:0 0 auto}
.hslide .hsdots{display:flex;gap:4px;margin-top:8px}
.hslide .hsdots i{width:14px;height:2.5px;border-radius:2px;background:rgba(255,255,255,.22)}
.hslide .hsdots i.on{background:var(--tape)}
@media (prefers-reduced-motion:reduce){.hslide .hsrow{transition:none}}
.ratenudge{display:block;width:100%;text-align:left;font-family:var(--fs);font-size:12px;line-height:1.45;color:#6B5307;
  background:#FFF3D1;border:1.5px solid var(--tape-dk);border-radius:10px;padding:10px 12px;margin:0 0 11px;cursor:pointer}
.ratenudge b{color:#15202A;white-space:nowrap}
body[data-theme="dark"] .ratenudge{background:#2A2310;border-color:#4A3C14;color:#E2D5A2}
body[data-theme="dark"] .ratenudge b{color:#F5B301}
.bizcard .bce{margin-left:auto;flex:0 0 auto;background:none;border:0;color:var(--mute);font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--fs)}
.instb{margin-top:10px;background:var(--tape);color:var(--ink);border:0;border-radius:8px;font-family:var(--fs);
  font-size:13px;font-weight:800;padding:9px 14px;cursor:pointer;display:none;align-items:center;gap:6px;position:relative;z-index:1}
.instb.on{display:inline-flex}
/* ---------- background themes ---------- */
body[data-bg="plain"] .wrap{background-image:none}
body[data-bg="blueprint"]{--paper:#E9EFF5;--grid:rgba(29,91,140,.13);--line:#D3DCE4;--line2:#E2E9EF}
body[data-bg="sand"]{--paper:#F3EBDB;--grid:rgba(150,118,58,.13);--line:#E2D8C2;--line2:#EDE5D2}
body[data-bg="auto"][data-cat="con"]{--paper:#F4ECE3;--grid:rgba(180,68,47,.10)}
body[data-bg="auto"][data-cat="np"]{--paper:#ECF1E7;--grid:rgba(46,107,79,.11)}
body[data-bg="auto"][data-cat="fin"]{--paper:#E9EFF3;--grid:rgba(29,91,140,.11)}
body[data-bg="auto"][data-cat="util"]{--paper:#EFF0F0;--grid:rgba(90,100,112,.11)}
/* ---------- contextual info hero ---------- */
.tback{display:none;align-items:center;gap:5px;background:none;border:0;cursor:pointer;font-family:var(--fs);
  font-size:12.5px;font-weight:700;color:var(--mute);padding:0 0 8px;margin-top:-4px;white-space:nowrap;text-align:left}
@media(min-width:760px){.tback{display:inline-flex}}
.tback:hover{color:var(--ink)}
@media print{.tback{display:none}}
.thero,.hhero{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:12px;
  padding:15px 112px 14px 16px;margin:2px 0 8px;box-shadow:0 2px 10px rgba(21,32,42,.15)}
.hhero{margin:0 0 13px;padding:21px 112px 21px 21px;
  animation:brandshift 26s ease-in-out infinite;
  background-image:
    repeating-linear-gradient(90deg,rgba(21,32,42,.85) 0 1.5px,transparent 1.5px 26px),
    linear-gradient(#F5B301,#F5B301),
    repeating-linear-gradient(90deg,rgba(21,32,42,.85) 0 1.5px,transparent 1.5px 26px),
    linear-gradient(#F5B301,#F5B301),
    repeating-linear-gradient(0deg,rgba(21,32,42,.85) 0 1.5px,transparent 1.5px 26px),
    linear-gradient(#F5B301,#F5B301),
    repeating-linear-gradient(0deg,rgba(21,32,42,.85) 0 1.5px,transparent 1.5px 26px),
    linear-gradient(#F5B301,#F5B301);
  background-size:100% 7px,100% 7px,100% 7px,100% 7px,7px 100%,7px 100%,7px 100%,7px 100%;
  background-position:top,top,bottom,bottom,left,left,right,right;
  background-repeat:no-repeat}
.thero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tape)}
.thero.cat-con::before{background:var(--con)}.thero.cat-np::before{background:var(--np)}
.thero.cat-fin::before{background:var(--fin)}.thero.cat-util::before{background:var(--util)}
.hkick{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--tape)}
.thero .t-nm,.hhero .t-nm{color:#fff;margin-top:2px}
.hinf{font-size:12.5px;color:#B9C4CE;line-height:1.55;margin-top:5px;max-width:430px}
.temo{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:58px;line-height:1;pointer-events:none;
  animation:temofloat 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
@keyframes temofloat{0%,100%{transform:translateY(-50%) rotate(0deg)}50%{transform:translateY(calc(-50% - 9px)) rotate(-7deg)}}
@media(max-width:430px){.temo{font-size:44px;right:12px}}
@media print{.temo{display:none}}
.htime{display:flex;align-items:center;gap:7px;margin:4px 0 2px;font-size:12.5px;font-weight:600;color:#D7DEE4}
.htime .hte{font-size:17px;line-height:1;animation:htebob 3s ease-in-out infinite}
.htime .htc{font-family:var(--fm);color:var(--tape);letter-spacing:.5px}
.htime .htd{color:#8F9CA8;font-size:11.5px}
@keyframes htebob{50%{transform:translateY(-3px)}}
.hnotice{position:absolute;right:12px;top:12px;z-index:2;max-width:170px;text-align:left;cursor:pointer;
  background:rgba(245,179,1,.13);border:1px solid rgba(245,179,1,.55);border-radius:10px;padding:7px 10px 8px;
  font-family:var(--fs);color:#F5D98B;transition:opacity .3s;animation:ntpulse 2.6s ease-in-out infinite}
.hnotice.due{background:rgba(224,90,64,.16);border-color:rgba(224,112,90,.65);color:#F5B8A8}
.hnotice .ntk{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
.hnotice .ntk .ndot{width:6px;height:6px;border-radius:50%;background:var(--tape);animation:ntblink 1.3s infinite}
.hnotice.due .ntk .ndot{background:#FF7A5C}
.hnotice .ntt{font-size:11.5px;font-weight:700;color:#fff;line-height:1.3;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hnotice .ntd{font-family:var(--fm);font-size:10px;margin-top:2px;opacity:.9}
.hnotice.fade{opacity:0}
@keyframes ntblink{50%{opacity:.25}}
@keyframes ntpulse{50%{box-shadow:0 0 12px rgba(245,179,1,.25)}}
@media(max-width:430px){.hnotice{max-width:128px;right:9px;top:9px}.hnotice .ntt{font-size:10.5px}}
.hic2{position:absolute;right:-14px;bottom:-18px;opacity:.2;line-height:0;pointer-events:none}
.hic2 svg{width:130px;height:130px;stroke:#fff}
.hic2 svg [stroke]{stroke:#fff!important}
.hic2 svg [fill="var(--ink)"]{fill:#F5B301}
@media(max-width:430px){.thero{padding-right:88px}.hhero{padding-right:92px}.hic2 svg{width:98px;height:98px}}
/* ---------- PDF template preview ---------- */
.pdfview{position:fixed;inset:0;z-index:95;background:rgba(11,18,26,.66);overflow:auto;padding:16px 12px 30px}
.pdfbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;max-width:540px;margin:0 auto 12px;background:var(--ink);
  border-radius:12px;padding:9px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.pdfbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#22303D;border:0;
  border-radius:8px;color:#fff;font-family:var(--fs);font-size:12.5px;font-weight:700;padding:10px 6px;cursor:pointer}
.pdfbar button.pp{background:var(--tape);color:#15202A}
.pdfbar button.pw{background:var(--wa)}
.pdfbar button.px{flex:0 0 44px;background:none;color:#8F9CA8;font-size:16px}
.pdfsheet{max-width:540px;margin:0 auto;background:#fff;color:#15202A;border-radius:10px;overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.45);font-family:var(--fs)}
.pdfsheet .ptape{height:9px;background-color:#F5B301;
  background-image:repeating-linear-gradient(90deg,rgba(21,32,42,.85) 0 1.5px,transparent 1.5px 32px),
  repeating-linear-gradient(90deg,rgba(21,32,42,.4) 0 1px,transparent 1px 7px);
  background-size:100% 100%,100% 55%;background-repeat:repeat-x}
.pdfsheet .pin{padding:20px 22px 18px}
.pdfsheet .phead{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #15202A;padding-bottom:13px}
.pdfsheet .phead img{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid #DDD}
.pdfsheet .pmono{width:52px;height:52px;border-radius:9px;background:#15202A;color:#F5B301;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:0 0 auto}
.pdfsheet .pbiz{font-size:18px;font-weight:800;line-height:1.2}
.pdfsheet .psub{font-size:11.5px;color:#5A6672;margin-top:2px}
.pdfsheet .pmeta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#5A6672;
  text-transform:uppercase;letter-spacing:1.1px;font-weight:700;margin:13px 0 4px}
.pdfsheet .ptool{font-size:15.5px;font-weight:800;margin-bottom:8px}
.pdfsheet .prow{display:flex;align-items:baseline;gap:6px;padding:6.5px 0;font-size:13.5px;border-bottom:1px dotted #D8D2C2}
.pdfsheet .prow .pl{color:#3A4652;max-width:58%}
.pdfsheet .prow .pdots{flex:1}
.pdfsheet .prow .pv{font-family:var(--fm);font-weight:600;white-space:nowrap}
.pdfsheet .prow .pu{font-family:var(--fm);font-size:11px;color:#8A94A0}
.pdfsheet .prow.psub2 .pl,.pdfsheet .prow.psub2 .pv{font-size:11.5px;color:#7A8590}

function uni2preeti(txt){
  if(!U2P_MAP){
    U2P_MAP = {};
    var pref = {"\u0930":"/","\u094d\u0930":"|","\u094d":"\\"};
    for(var k in PREETI_MAP){ var u = PREETI_MAP[k]; if(u && u.length && !(u in U2P_MAP)) U2P_MAP[u] = k; }

    U2P_MAP["\u092b"]="km"; U2P_MAP["\u091d"]="\u00b4"; U2P_MAP["\u090a"]="pm"; U2P_MAP["\u0908"]="O{";
    U2P_MAP["\u094b"]=null; U2P_MAP["\u094c"]=null; /* decomposed below */
  }
  txt = txt.replace(/\u094b/g,"\u093e\u0947").replace(/\u094c/g,"\u093e\u0948")
           .replace(/\u0913/g,"\u0905\u093e\u0947").replace(/\u0914/g,"\u0905\u093e\u0948")
           .replace(/\u0906/g,"\u0905\u093e").replace(/\u0910/g,"\u090f\u0947");
  /* reph र् + cluster → cluster + {  */
  txt = txt.replace(/\u0930\u094d((?:[\u0915-\u0939]\u094d)*[\u0915-\u0939][\u093e\u093f\u0940\u0941\u0942\u0943\u0947\u0948\u0902\u0903\u0901]*)/g, "$1{");
  /* ि before its cluster */
  txt = txt.replace(/((?:[\u0915-\u0939]\u094d)*[\u0915-\u0939])\u093f/g, "\u093f$1");
  var out = "";
  for(var i=0;i<txt.length;){
    var hit = null, len = 0;
    for(var l=Math.min(4, txt.length-i); l>=1; l--){
      var seg = txt.substr(i,l);
      if(U2P_MAP[seg]){ hit = U2P_MAP[seg]; len = l; break; }
    }
    if(hit){ out += hit; i += len; } else { out += txt[i]; i++; }
  }
  return out;
}

{ id:"roofsheet", cat:"con", ic:"🛖", neu:true,
  nm:["जस्ता पाता Calculator","Roofing Sheet"],
  sb:["छानाको नाप → कति पाता","Roof size → sheets needed"],

  ex:["२४ × १६ ft छाना, ८ ft × 2.75 ft पाता, १५% overlap — २१ पाता",
      "24 × 16 ft roof, 8 × 2.75 ft sheet, 15% overlap — 21 sheets"],
  f:[ {k:"rt",l:["छानाको किसिम","Roof type"],t:"s",d:"flat",o:[["flat",["सिधा / भिरालो नाप थाहा छ","Flat / slope length known"]],["lean",["एकतर्फी भिरालो (त्रिकोण — half)","Lean-to (one slope)"]],["gable",["दुईतर्फी भिरालो (गेबल)","Gable (two slopes)"]]]},
      {k:"l",l:["छानाको लम्बाइ","Roof length"],u:U.ft,d:24,w:1},
      {k:"w",l:["छानाको चौडाइ (भिरालोतिरको)","Roof width (slope side)"],u:U.ft,d:16,w:1,sif:function(v){return v.rt==="flat";}},
      {k:"sp",l:["तेर्सो चौडाइ (span)","Horizontal span"],u:U.ft,d:16,w:1,sif:function(v){return v.rt!=="flat";}},
      {k:"rh",l:["धुरीको उचाइ (rise)","Ridge height (rise)"],u:U.ft,d:4,w:1,sif:function(v){return v.rt!=="flat";}},
      {k:"sl",l:["पाताको लम्बाइ","Sheet length"],u:U.ft,d:8,w:1},
      {k:"sw",l:["पाताको चौडाइ","Sheet width"],u:U.ft,d:2.75,w:1},
      {k:"ov",l:["Overlap (जोडाइ)","Overlap"],u:U.pct,d:15,w:1} ],
  calc:function(v){
    var Lg = n(v.l), W, slopeRows = [];
    if(v.rt==="flat"){ W = n(v.w); }
    else {
      var span = n(v.sp), rise = n(v.rh);
      if(span<=0) return {err:["तेर्सो चौडाइ (span) हाल्नुहोस्।","Enter the horizontal span."]};
      var run = (v.rt==="gable") ? span/2 : span;
      var slope = Math.sqrt(run*run + rise*rise);
      W = (v.rt==="gable") ? slope*2 : slope;
      slopeRows.push(row(["भिरालो नाप (एक साइड) √("+fmt(run,1)+"²+"+fmt(rise,1)+"²)","Slope length (one side)"], fmt(slope,2), U.ft));
      if(v.rt==="gable") slopeRows.push(row(["दुवै साइड जोड्दा","Both sides"], fmt(W,2), U.ft, "sub"));
    }
    var area = Lg*W;
    if(area<=0) return {err:["छानाको नाप हाल्नुहोस्।","Enter the roof size."]};
    var sl = n(v.sl), sw = n(v.sw), ov = n(v.ov)||0;
    if(sl<=0 || sw<=0) return {err:["पाताको साइज हाल्नुहोस् — supplier अनुसार फरक हुन्छ।","Enter the sheet size — it varies by supplier."]};
    if(ov>=50) return {err:["Overlap ५०% भन्दा कम हुनुपर्छ।","Overlap must be below 50%."]};
    var cov = sl*sw*(1-ov/100), sheets = ceil(area/cov);
    return { rows: slopeRows.concat([
      row(["छानाको क्षेत्रफल","Roof area"], fmt(area,2), U.sqft),
      row(["पाताको नाप","Sheet size"], fmt(sl,2)+" × "+fmt(sw,2), U.ft),
      row(["प्रति पाताले छोप्ने (overlap घटाई)","Coverage per sheet (less overlap)"], fmt(cov,2), U.sqft, "sub"),
      row(["थप राख्दा राम्रो (जगेडा)","Suggested spare"], "+ "+Math.max(1,ceil(sheets*0.05)), ["पाता","sheets"], "sub"),
      row(["चाहिने पाता","Sheets needed"], fmt(sheets,0), ["पाता","sheets"], "big") ]),
      note:["भिरालो नाप = √(तेर्सो² + उचाइ²) — जस्ता किन्दा भिरालो नापले किन्नुपर्छ, तेर्सोले होइन। पाताको साइज र overlap supplier अनुसार फरक हुन्छ — आफ्नै नाप हाल्नुहोस्।",
            "Slope = √(span² + rise²) — buy sheets by the slope length, not the horizontal span. Sheet size and overlap vary by supplier — type your own."] };

{ id:"jagga", cat:"np", star:true, ic:"🗺️",
  nm:["जग्गा Converter","Land Converter"],

  kw:"land jagga ropani aana paisa daam bigha kattha dhur sqft jamin plot",
  ex:["२ रोपनी ८ आना → sq.ft, बिघा, र दर अनुसार मूल्य",
      "2 ropani 8 aana → sq.ft, bigha and total value"],
  f:[ {k:"m",l:["कुन प्रणालीबाट?","Input system"],t:"s",d:"ropani",o:[["ropani",["रोपनी – आना – पैसा – दाम","Ropani – aana – paisa – daam"]],["bigha",["बिघा – कठ्ठा – धुर","Bigha – kattha – dhur"]],["sqft",["वर्ग फिट (sq.ft)","Square feet (sq.ft)"]],["sqm",["वर्ग मिटर (sq.m)","Square metre (sq.m)"]]]},
      {k:"r1",l:["रोपनी","Ropani"],d:2,w:1,sif:function(v){return v.m==="ropani";}},
      {k:"r2",l:["आना","Aana"],d:8,w:1,sif:function(v){return v.m==="ropani";}},
      {k:"r3",l:["पैसा","Paisa"],d:0,w:1,sif:function(v){return v.m==="ropani";}},
      {k:"r4",l:["दाम","Daam"],d:0,w:1,sif:function(v){return v.m==="ropani";}},
      {k:"b1",l:["बिघा","Bigha"],d:1,w:1,sif:function(v){return v.m==="bigha";}},
      {k:"b2",l:["कठ्ठा","Kattha"],d:0,w:1,sif:function(v){return v.m==="bigha";}},
      {k:"b3",l:["धुर","Dhur"],d:0,w:1,sif:function(v){return v.m==="bigha";}},
      {k:"sf",l:["वर्ग फिट","Square feet"],u:U.sqft,d:5476,sif:function(v){return v.m==="sqft";}},
      {k:"sm",l:["वर्ग मिटर","Square metre"],u:U.sqm,d:508.72,sif:function(v){return v.m==="sqm";}},
      {k:"rate",l:["जग्गाको दर","Land rate"],u:["रु","Rs"],d:0,w:1},
      {k:"ru",l:["दर प्रति","Rate per"],t:"s",d:"aana",o:[["aana",["आना","Aana"]],["dhur",["धुर","Dhur"]],["ropani",["रोपनी","Ropani"]],["kattha",["कठ्ठा","Kattha"]],["sqft",["वर्ग फिट","Square foot"]]],w:1} ],
  calc:function(v){
    var sq = 0;
    if(v.m === "ropani") sq = n(v.r1)*LAND.ropani + n(v.r2)*LAND.aana + n(v.r3)*LAND.paisa + n(v.r4)*LAND.daam;

    if(sq<=0) return {err:["जग्गाको नाप हाल्नुहोस्।","Enter the land area."]};
    var x = sq, ro = Math.floor(x/LAND.ropani); x -= ro*LAND.ropani;
    var aa = Math.floor(x/LAND.aana); x -= aa*LAND.aana;
    var pa = Math.floor(x/LAND.paisa); x -= pa*LAND.paisa;
    var da = Math.round(x/LAND.daam*100)/100;
    var y = sq, bi = Math.floor(y/LAND.bigha); y -= bi*LAND.bigha;
    var ka = Math.floor(y/LAND.kattha); y -= ka*LAND.kattha;
    var dh = Math.round(y/LAND.dhur*100)/100;
    var rows = [
      row(["वर्ग फिट","Square feet"], fmt(sq,2), U.sqft),
      row(["वर्ग मिटर","Square metre"], fmt(sq*SQFT_M2,2), U.sqm),
      row(["रोपनी–आना–पैसा–दाम","Ropani–aana–paisa–daam"], fmt(ro,0)+"–"+fmt(aa,0)+"–"+fmt(pa,0)+"–"+fmt(da,2), ""),
      row(["बिघा–कठ्ठा–धुर","Bigha–kattha–dhur"], fmt(bi,0)+"–"+fmt(ka,0)+"–"+fmt(dh,2), ""),
      row(["जम्मा आना","Total aana"], fmt(sq/LAND.aana,3), ["आना","aana"], "sub"),
      row(["जम्मा धुर","Total dhur"], fmt(sq/LAND.dhur,3), ["धुर","dhur"], "sub") ];
    var rt = n(v.rate);
    if(rt > 0){
      var per = { aana:LAND.aana, dhur:LAND.dhur, ropani:LAND.ropani, kattha:LAND.kattha, sqft:1 }[v.ru] || LAND.aana;
      rows.push(row(["जम्मा मूल्य","Total value"], rs(sq/per*rt), "", "big"));
    }
    return { rows:rows,
      note:["१ रोपनी = ५,४७६ sq.ft = १६ आना · १ बिघा = ७२,९०० sq.ft = २० कठ्ठा (≈ १३.३१ रोपनी)। लालपुर्जा र नापी नक्सासँग भिडाउनुहोस्।",
            "1 ropani = 5,476 sq.ft = 16 aana · 1 bigha = 72,900 sq.ft = 20 kattha (≈ 13.31 ropani). Always cross-check with the land certificate and survey map."] };
  }},

/* ---------------- 11. Super Calculator (+ VAT) ---------------- */
(function(){
  var C = { cur:"0", acc:null, op:null, fresh:true, expr:"", vat:null, bad:false };
  var SYM = { "+":"+", "-":"−", "*":"×", "/":"÷" };
  function num(){ var x = parseFloat(C.cur); return isFinite(x) ? x : 0; }
  function r10(x){ return Math.round(x*1e10)/1e10; }
  function show(s){
    if(C.bad) return L("गल्ती","Error");
    var neg = s.charAt(0) === "-", t = neg ? s.slice(1) : s, p = t.split(".");
    var ip = (p[0] === "" ? "0" : p[0]);
    return (neg?"-":"") + (+ip).toLocaleString("en-IN") + (p.length>1 ? "."+p[1] : "");
  }
  function apply(){
    if(C.op === null || C.acc === null) return num();
    var a = C.acc, b = num(), r;
    if(C.op === "+") r = a+b; else if(C.op === "-") r = a-b;
    else if(C.op === "*") r = a*b; else r = (b === 0 ? NaN : a/b);
    if(!isFinite(r)){ C.bad = true; return 0; }
    return r10(r);
  }
  function reset(){ C.cur = "0"; C.acc = null; C.op = null; C.fresh = true; C.expr = ""; C.vat = null; C.bad = false; }
  function rate(){ var e = document.getElementById("vrate"); var r = e ? parseFloat(e.value) : 13; return isFinite(r) ? r : 13; }
  function render(){
    var dv = document.getElementById("dval"), de = document.getElementById("dexp"), vo = document.getElementById("vatout");
    if(!dv) return;
    dv.textContent = show(C.cur);
    de.textContent = C.expr || "\u00a0";
    if(C.vat){
      var h = '<div class="slip"><div class="slip-h">'
        + esc(C.vat.mode === "add" ? L("VAT थपिएको","VAT added") : L("VAT निकालिएको","VAT removed"))
        + '</div>';
      h += slipRow(L("आधार रकम (VAT बिना)","Base amount (excl. VAT)"), rs(C.vat.base), "", "");
      h += slipRow("VAT " + fmt(C.vat.r,2) + "%", rs(C.vat.vat), "", "");
      h += slipRow(L("जम्मा रकम (VAT सहित)","Total (incl. VAT)"), rs(C.vat.tot), "", "big");
      var vw = calcWords(C.vat.tot);
      if(vw && vw !== "\u00a0") h += '<div class="row txt sub"><span class="rl">'+esc(L("अक्षरमा","In words"))+'</span><span class="rv">'+vw+'</span></div>';
      h += '<div class="note">ℹ️ ' + esc(L("नेपालको मानक VAT दर १३%। माथिको बक्समा दर बदल्न सकिन्छ।",
             "Nepal's standard VAT rate is 13%. You can change the rate in the box above.")) + '</div></div>';
      vo.innerHTML = h;
    } else vo.innerHTML = "";
    var dw = document.getElementById("dwords");
    if(dw){
      var wv = C.vat ? C.vat.tot : num();
      dw.innerHTML = calcWords(wv);
    }
    setSticky(C.vat ? L("जम्मा (VAT सहित)","Total (incl. VAT)") : L("नतिजा","Result"),
              C.vat ? rs(C.vat.tot) : show(C.cur));
  }
  function calcWords(x){
    if(!isFinite(x) || Math.abs(x) < 1) return "\u00a0";
    var neg = x < 0, rup = Math.floor(Math.abs(x));
    if(rup < 1 || rup >= 1e14) return "\u00a0";
    var w = (LANG===0) ? npWords(rup) : enWords(rup);
    if(!w) return "\u00a0";
    if(LANG!==0) w = w.charAt(0).toUpperCase()+w.slice(1);
    return (neg ? (LANG===0?"ऋण ":"minus ") : "") + esc(w) + " " + L("रुपैयाँ","rupees");
  }
  function press(a, val){
    if(C.bad && a !== "c"){ reset(); }
    if(a === "d"){
      if(C.fresh){ C.cur = val; C.fresh = false; }
      else if(C.cur.replace(/[-.]/g,"").length < 13){ C.cur = (C.cur === "0" ? val : C.cur + val); }
      C.vat = null;
    } else if(a === "dot"){
      if(C.fresh){ C.cur = "0."; C.fresh = false; }
      else if(C.cur.indexOf(".") < 0) C.cur += ".";
      C.vat = null;
    } else if(a === "c"){ reset();
    } else if(a === "back"){
      if(!C.fresh){ C.cur = C.cur.slice(0,-1); if(C.cur === "" || C.cur === "-") C.cur = "0"; }
      C.vat = null;
    } else if(a === "op"){
      var r = apply();
      C.acc = r; C.cur = String(r); C.op = val; C.fresh = true; C.vat = null;
      C.expr = show(String(r)) + " " + SYM[val];
    } else if(a === "eq"){

  calc:function(v){
    var P = n(v.p), r = n(v.r)/1200;
    var N = Math.round((v.tu === "m") ? n(v.t) : n(v.t)*12);

      ip = bal*r; pp = emi - ip; pay = emi;
      if(i === N || pp >= bal){ pp = bal; pay = pp + ip; }
      ti += ip; bal = Math.max(0, bal - pp);
      items.push({m:i, pay:pay, pr:pp, ip:ip, bal:bal});

    }

      row(["मासिक किस्ता (EMI)","Monthly EMI"], rs(emi), "", "big hero"),
      row(["साँवा (ऋण रकम)","Principal (loan)"], rs(P), ""),

      row(["जम्मा भुक्तानी (साँवा+ब्याज)","Total payment (principal+interest)"], rs(P+ti), ""),

function patro(by,bm,bd){
  var d = Date.UTC(by,bm-1,bd,6,15)/86400000 + 2440587.5 - 2451545;
  var rad = Math.PI/180;
  var g = (357.529 + 0.98560028*d)*rad;
  var sun = 280.459 + 0.98564736*d + 1.915*Math.sin(g) + 0.02*Math.sin(2*g);
  var M = (134.963 + 13.064993*d)*rad, D = (297.8502 + 12.19074912*d)*rad;
  var moon = 218.316 + 13.176396*d + 6.289*Math.sin(M) - 1.274*Math.sin(M-2*D)
           + 0.658*Math.sin(2*D) - 0.214*Math.sin(2*M) - 0.186*Math.sin(g);
  var aya = 23.85 + 0.01397*(by-2000);
  var sid = ((moon-aya)%360+360)%360;
  var phase = ((moon-sun)%360+360)%360;
  return { nak:Math.floor(sid/(360/27)), pada:Math.floor((sid%(360/27))/(360/108)),
           rashi:Math.floor(sid/30), ti:Math.floor(phase/12) };
}

function tableText(t){
  var A = [t.title + " · " + (t.sub||""), t.head.join("\t")];
  t.rows.forEach(function(r){ A.push(r.g ? r.g : r.join("\t")); });
  return A.join("\n");
}
function moneyWords(val){
  if(typeof val !== "string") return "";
  var s = val.trim().replace(/^[+]\s*/,"").replace(/^[−-]\s*/,"-");
  var mm = s.match(/^(-?)(रु|Rs)?\s*([\d,]+(?:\.\d+)?)\s*(%?)$/);
  if(!mm) return "";
  var neg = mm[1]==="-", isMoney = !!mm[2], isPct = mm[4]==="%";
  var x = parseFloat(mm[3].replace(/,/g,""));
  if(!isFinite(x) || x < 1 || x >= 1e14) return "";
  var rup = Math.floor(x), frac = x - rup;
  if(!isMoney && frac >= 0.005) return "";
  var w = LANG ? enWords(rup) : npWords(rup);
  if(!w) return "";
  if(LANG) w = w.charAt(0).toUpperCase()+w.slice(1);
  var suffix = isMoney ? (LANG?" rupees":" रुपैयाँ") : (isPct ? (LANG?" percent":" प्रतिशत") : "");
  return (neg ? (LANG?"minus ":"ऋण ") : "") + w + suffix;
}
function compute(){
  var t = cur, v = state[t.id], out;
  try { out = t.calc(v); } catch(e){ out = {err:["हिसाब मिलेन — नाप फेरि हेर्नुहोस्।","That didn't compute — please check the inputs."]}; }
  lastOut = out; lastTable = out.table || null;
  var box = $("#out");
  if(out.err){ box.innerHTML = '<div class="err">⚠️ '+esc(S(out.err))+'</div>'; stickyEl.style.display = "none"; return; }
  var html = printHead() + '<div class="slip"><div class="slip-h"><span>'+esc(S(UI.result))+' · '+esc(S(t.nm))+'</span><span class="slipmeta">'+esc(slipMeta())+'</span></div>';
  out.rows.forEach(function(r){
    html += slipRow(S(r.l), r.v, S(r.u), r.c);
    if(r.c.indexOf("big") >= 0){
      var mw = moneyWords(r.v);
      if(mw) html += '<div class="row txt sub"><span class="rl">'+esc(L("अक्षरमा","In words"))+'</span><span class="rv">'+esc(mw)+'</span></div>';
    }
  });
  if(out.note) html += '<div class="note">ℹ️ '+esc(S(out.note))+'</div>';
  html += '</div>';
  if(out.table) html += tableHtml(out.table);
  box.innerHTML = html;
  var big = null;
  out.rows.forEach(function(r){ if(!big && r.c.indexOf("big") >= 0) big = r; });
  if(!big) big = out.rows[0];
  setSticky(S(big.l), big.v + (S(big.u) ? " " + S(big.u) : ""));
}
function shareText(){
  var t = cur, A = ["📐 Ganak — " + S(t.nm), "─────────────"];
  if(t.custom){ A.push(t.share()); }
  else {
    var v = state[t.id];
    visFields(t,v).forEach(function(f){
      var val = v[f.k];
      if(f.t === "s"){ f.o.forEach(function(o){ if(String(o[0]) === String(val)) val = S(o[1]); }); }
      if(val === "" || val === undefined) return;
      A.push("• " + S(f.l) + (f.u ? " ("+S(f.u)+")" : "") + ": " + val);
    });
    A.push("─────────────");
    if(lastOut && lastOut.rows){
      lastOut.rows.forEach(function(r){
        A.push((r.c.indexOf("big") >= 0 ? "➡️ " : "") + S(r.l) + ": " + r.v + (S(r.u) ? " " + S(r.u) : ""));
        if(r.c.indexOf("big") >= 0){ var mw = moneyWords(r.v); if(mw) A.push("   ("+mw+")"); }
      });
      if(lastOut.note) A.push("ℹ️ " + S(lastOut.note));
    } else if(lastOut && lastOut.err){ A.push("⚠️ " + S(lastOut.err)); }
  }
  A.push("─────────────", "Powered by PRERAK MULTIPURPOSE PVT LTD · Hetauda");
  return A.join("\n");
}

function copyText(txt, msg){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg); } catch(err){ toast(S(UI.nocopy)); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(msg); }, fallback);
  } else fallback();
}

  var css=document.createElement("style");
  css.textContent='.exwrap{position:fixed;inset:0;background:rgba(21,32,42,.55);z-index:9000;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}'

   +'.exwrap.show .exbox{transform:none}'
   +'.ext{font-weight:800;font-size:17px;color:var(--ink);margin-bottom:4px}'
   +'.exs{font-size:13px;color:var(--mut);margin-bottom:14px}'
   +'.exrow{display:flex;gap:10px}'
   +'.exrow button{flex:1;padding:13px;border-radius:11px;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}'
   +'.exrow .exyes{background:var(--tape);border-color:var(--tape-dk);color:#15202A}'
   +'body[data-theme="dark"] .exbox{background:#1B2732}'
   +'body[data-theme="dark"] .exrow button{background:#243140;border-color:#33414F;color:#E8ECF0}'
   +'body[data-theme="dark"] .exrow .exyes{background:var(--tape);border-color:var(--tape-dk);color:#15202A}';
  document.head.appendChild(css);
  var armed=false;
  function showExit(){
    var d=document.createElement("div");
    d.className="exwrap"; d.id="exwrap";
    d.innerHTML='<div class="exbox"><div class="ext">'+L("बाहिर निस्कने?","Exit Ganak?")+'</div>'
      +'<div class="exs">'+L("तपाईंको सबै डाटा phone मै save छ — फेरि खोल्दा यहीँ हुनेछ।","All your data is saved on this phone.")+'</div>'
      +'<div class="exrow"><button class="exno">'+L("रहने","Stay")+'</button><button class="exyes">'+L("निस्कने","Exit")+'</button></div></div>';
    document.body.appendChild(d);
    requestAnimationFrame(function(){ d.classList.add("show"); });
    function close(){ d.classList.remove("show"); setTimeout(function(){ d.remove(); },200); }
    d.addEventListener("click",function(e){
      if(e.target.closest(".exyes")){ armed=true; d.remove(); history.back(); return; }
      if(e.target.closest(".exno")||e.target===d){ close(); history.pushState({g:1},""); }
    });
  }
  /* seed one history entry so back on home lands on our guard */
  try{ history.replaceState({g:0},""); history.pushState({g:1},""); }catch(e){}
  window.addEventListener("popstate",function(){
    if(armed) return;
    /* open overlays close first */
    var dr=document.getElementById("drawer");
    if(dr && dr.classList.contains("on")){ closeDrawer(); history.pushState({g:1},""); return; }
    if(document.body.classList.contains("sideopen")){ closeSide(); history.pushState({g:1},""); return; }
    var pv=document.getElementById("pdfview");
    if(pv){ pv.remove(); document.body.classList.remove("pdfmode"); history.pushState({g:1},""); return; }

  });
})();

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
window.__ganakSR = !!SR;
var VREC=null;
function startVoice(){
  if(!SR) return;
  var mic=document.querySelector('.vbtn.mic');
  if(VREC){ try{VREC.stop();}catch(e){} VREC=null; if(mic) mic.classList.remove("rec"); return; }
  VREC=new SR();
  VREC.lang = LANG ? "en-US" : "ne-NP";
  VREC.interimResults=false; VREC.maxAlternatives=1;
  if(mic) mic.classList.add("rec");
  VREC.onresult=function(ev){
    var P=window.__calcPress; if(!P) return;
    var said=ev.results[0][0].transcript||"";
    var expr=voiceParse(said);
    if(!expr){ toast(L("बुझिएन — फेरि भन्नुहोस्","Didn't catch that — try again")); return; }
    P("c");
    var i=0;
    while(i<expr.length){
      var ch=expr[i];
      if(ch>="0"&&ch<="9"){ P("d",ch); }
      else if(ch==="."){ P("dot"); }
      else if(ch==="+"||ch==="-"||ch==="*"||ch==="/"){ P("op",ch); }
      else if(ch==="="){ P("eq"); }
      else if(ch==="%"){ P("pct"); }
      i++;
    }
    if(expr.indexOf("=")<0 && /[+\-*\/]/.test(expr)) P("eq");
    toast("🎙 "+said.slice(0,40));
  };
  VREC.onend=function(){ VREC=null; var m=document.querySelector('.vbtn.mic'); if(m) m.classList.remove("rec"); };
  VREC.onerror=function(){ toast(L("आवाज सुनिएन","Couldn't hear you")); };
  try{ VREC.start(); }catch(e){}
}
function voiceParse(s){
  var map={"शून्य":"0","सुन्ना":"0","एक":"1","दुई":"2","तीन":"3","चार":"4","पाँच":"5","पांच":"5","छ":"6","सात":"7","आठ":"8","नौ":"9","दश":"10",
  "जोड":"+","घटाउ":"-","गुणा":"*","गुना":"*","भाग":"/","प्लस":"+","माइनस":"-",
  "plus":"+","minus":"-","times":"*","into":"*","multiplied by":"*","divided by":"/","over":"/","equals":"=","बराबर":"="};
  s=" "+s.toLowerCase()+" ";
  Object.keys(map).sort(function(a,b){return b.length-a.length;}).forEach(function(k){
    s=s.split(k).join(" "+map[k]+" ");
  });
  s=s.replace(/[०-९]/g,function(d){return "०१२३४५६७८९".indexOf(d);});
  s=s.replace(/lakh|लाख/g,"00000").replace(/hajar|हजार/g,"000").replace(/crore|करोड/g,"0000000");
  return s.replace(/[^0-9+\-*\/.=%]/g,"").trim();
}
