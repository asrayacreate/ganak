/* Ganak for Google Play: a Trusted Web Activity (the same app PWABuilder made — same package, same website)
   plus the "आजको मिति" home-screen widget. Built by .github/workflows/android.yml. */
plugins {
    id "com.android.application"
}

/* versionName = the web app's version (its footer: "Ganak v10.5"), so the Play listing never lags behind the
   site again (it sat at 9.7 while the web was 10.5); -PversionName=… overrides */
def webVersion = {
    def f = new File(rootDir, "../index.html")
    if (!f.exists()) return "0.0"
    def m = java.util.regex.Pattern.compile("Ganak v(\\d+(?:\\.\\d+)+)").matcher(f.getText("UTF-8"))
    return m.find() ? m.group(1) : "0.0"
}()

android {
    namespace "io.github.asrayacreate.twa"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.asrayacreate.twa"
        minSdk 24
        targetSdk 36
        /* must be higher than the version now on Play — CI passes 1000 + the run number */
        versionCode((project.findProperty("versionCode") ?: "1000") as int)
        versionName((project.findProperty("versionName") ?: webVersion) as String)
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
    testImplementation "junit:junit:4.13.2"
}
