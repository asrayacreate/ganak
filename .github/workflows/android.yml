# Builds the Google Play app (Trusted Web Activity + "आजको मिति" home-screen widget) from android/.
# Signed with your Play upload key when these repository secrets exist (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64  — the keystore file from the PWABuilder zip, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — from signing-key-info.txt
# Without them it still builds and tests (unsigned release bundle + a debug APK).
# With them it also saves upload_certificate.pem (public) and prints the key's SHA-256, for Play Console
# (e.g. "Request upload key reset" when the old PWABuilder key is lost).
name: Android app (TWA + widget)

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml", "index.html"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calendar data from index.html
        run: node android/tools/gen_calendar.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Upload key (only if the secrets are set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
          else
            echo "No keystore secret — building unsigned"
          fi

      - name: Test and build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -PversionCode=$((1000 + GITHUB_RUN_NUMBER)) testDebugUnitTest assembleDebug bundleRelease assembleRelease

      - name: Version (versionName comes from index.html's "Ganak vX.Y")
        working-directory: android
        run: |
          echo "web: $(grep -o 'Ganak v[0-9.]*' ../index.html | head -1)"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/aapt2" dump badging app/build/outputs/apk/debug/*.apk | head -1 || true

      - name: Upload key certificate for Play Console (only if the secrets are set)
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -rfc -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            -file android/app/build/outputs/upload_certificate.pem
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "SHA256:|Valid"

      - uses: actions/upload-artifact@v4
        with:
          name: ganak-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/upload_certificate.pem
